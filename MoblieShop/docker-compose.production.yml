services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mobileshop-db-production
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env.production}"
    ports:
      - "1435:1433"
    volumes:
      - mobileshop-sql-data-production:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mobileshop-app-production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=MoblieShopDbProduction;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env.production};TrustServerCertificate=True;MultipleActiveResultSets=true"
    ports:
      - "5124:5122"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mobileshop-sql-data-production:
