services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mobileshop-db-development
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env.development}"
    ports:
      - "1433:1433"
    volumes:
      - mobileshop-sql-data-development:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: ./MoblieShop
      dockerfile: Dockerfile
    container_name: mobileshop-app-development
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=MoblieShopDbDevelopment;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env.development};TrustServerCertificate=True;MultipleActiveResultSets=true"
    ports:
      - "5122:5122"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mobileshop-sql-data-development:
