name: CI/CD MobileShop

on:
  pull_request:
    branches:
      - dev
      - stag
      - master
  push:
    branches:
      - dev
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      action:
        description: "Promotion or rollback action"
        required: true
        type: choice
        options:
          - promote-staging
          - promote-production
          - rollback-production
      source_tag:
        description: "Existing GHCR tag, for example sha-<commit>, stag, or previous-prod"
        required: true
        type: string

env:
  DOTNET_VERSION: 8.x
  PROJECT_PATH: MoblieShop/MoblieShop.csproj
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

jobs:
  ci:
    name: Lint, test, build and quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install SonarScanner for .NET
        if: github.actor != 'nektos/act'
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Begin Sonar analysis
        if: github.actor != 'nektos/act'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          dotnet-sonarscanner begin
          /k:"${SONAR_PROJECT_KEY}"
          /o:"${SONAR_ORGANIZATION}"
          /d:sonar.token="${SONAR_TOKEN}"
          /d:sonar.cs.opencover.reportsPaths="${{ github.workspace }}/**/coverage.opencover.xml"

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Lint and format check
        continue-on-error: ${{ vars.LINT_STRICT != 'true' }}
        run: dotnet format "${{ env.PROJECT_PATH }}" --verify-no-changes --no-restore

      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Unit tests with coverage
        run: >-
          dotnet test "${{ env.PROJECT_PATH }}"
          --configuration Release
          --no-build
          --no-restore
          --collect:"XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Publish deployable application
        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release --no-build --output ./publish --no-restore

      - name: End Sonar analysis and enforce quality gate
        if: github.actor != 'nektos/act'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Upload application artifact
        if: github.actor != 'nektos/act'
        uses: actions/upload-artifact@v4
        with:
          name: mobileshop-publish-${{ github.sha }}
          path: publish
          if-no-files-found: error

  build-dev-artifact:
    name: Build immutable artifact once
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: ./MoblieShop
          file: ./MoblieShop/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:dev
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy-dev:
    name: Deploy exact artifact to dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: build-dev-artifact
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create .env.development file
        run: |
          echo "MSSQL_SA_PASSWORD=${{ secrets.MSSQL_SA_PASSWORD }}" > .env.development
      - name: Tear down old docker stack
        run: |
          docker compose -f docker-compose.development.yml --env-file .env.development.example down --volumes --remove-orphans || true
      - name: Start services via Docker Compose
        run: |
          docker compose -f docker-compose.development.yml --env-file .env.development.example up -d --build         
      - name: Smoke test endpoint
        shell: bash
        run: |
          echo "Waiting for app to respond on http://localhost:5122/..."
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:5122/ >/dev/null 2>&1; then
              echo "Smoke test passed! App and Database are running healthy."
              exit 0
            fi
            sleep 3
          done

          echo "Smoke test failed. App logs:"
          docker logs mobileshop-app-development
          echo "Database logs:"
          docker logs mobileshop-db-development
          exit 1          
  
  promote-staging:
    name: Approve and promote exact artifact to staging
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'promote-staging'
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare environment variables
        run: |
          echo "MSSQL_SA_PASSWORD=${{ secrets.MSSQL_SA_PASSWORD }}" > .env.staging
          echo "IMAGE_TAG=${{ inputs.source_tag }}" >> .env.staging

      - name: Pull target image from GHCR
        shell: bash
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker pull "${IMAGE_NAME}:${{ inputs.source_tag }}"
          docker tag "${IMAGE_NAME}:${{ inputs.source_tag }}" "${IMAGE_NAME}:stag"
          docker push "${IMAGE_NAME}:stag"

      - name: Tear down old staging stack
        run: |
          docker compose -f docker-compose.staging.yml --env-file .env.staging down --volumes --remove-orphans || true

      - name: Deploy to staging via Docker Compose
        run: |
          docker compose -f docker-compose.staging.yml --env-file .env.staging up -d

      - name: Smoke test staging endpoint
        shell: bash
        run: |
          echo "Waiting for staging app to respond on http://localhost:5123/..."
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:5123/ >/dev/null 2>&1; then
              echo "Staging smoke test passed!"
              exit 0
            fi
            sleep 3
          done

          echo "Staging smoke test failed. Logs:"
          docker logs mobileshop-app-staging || true
          docker logs mobileshop-db-staging || true
          exit 1

  promote-production:
    name: Canary and promote exact artifact to production
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'promote-production'
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Canary check on source tag
        shell: bash
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          PRODUCTION_HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          set -euo pipefail
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "Validating Canary health for ${IMAGE_NAME}:${SOURCE_TAG}"
          
          if [ -n "${PRODUCTION_HEALTH_URL:-}" ]; then
            failures=0
            for attempt in {1..10}; do
              if ! curl --fail --silent --show-error --max-time 5 "${PRODUCTION_HEALTH_URL}" >/dev/null; then
                failures=$((failures + 1))
              fi
              sleep 1
            done
            if [ "$failures" -gt 2 ]; then
              echo "Canary failed: ${failures}/10 health checks failed."
              exit 1
            fi
            echo "Canary passed successfully."
          else
            echo "No HEALTH_URL provided, skipping active endpoint canary check."
          fi

      - name: Tag and Push Production Image to GHCR
        shell: bash
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker pull "${IMAGE_NAME}:${{ inputs.source_tag }}"
          docker tag "${IMAGE_NAME}:${{ inputs.source_tag }}" "${IMAGE_NAME}:prod"
          docker tag "${IMAGE_NAME}:${{ inputs.source_tag }}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:prod"
          docker push "${IMAGE_NAME}:latest"

      - name: Prepare production environment variables
        run: |
          echo "MSSQL_SA_PASSWORD=${{ secrets.MSSQL_SA_PASSWORD }}" > .env.production
          echo "IMAGE_TAG=prod" >> .env.production

      - name: Deploy to production via Docker Compose
        run: |
          docker compose -f docker-compose.production.yml --env-file .env.production down --remove-orphans || true
          docker compose -f docker-compose.production.yml --env-file .env.production up -d

  rollback-production:
    name: Roll back production to exact artifact
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback-production'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Rollback image tags on GHCR
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "Rolling back Production to tag: ${{ inputs.source_tag }}"
          
          docker pull "${IMAGE_NAME}:${{ inputs.source_tag }}"
          docker tag "${IMAGE_NAME}:${{ inputs.source_tag }}" "${IMAGE_NAME}:prod"
          docker tag "${IMAGE_NAME}:${{ inputs.source_tag }}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:prod"
          docker push "${IMAGE_NAME}:latest"

      - name: Prepare environment and redeploy previous stack
        run: |
          echo "MSSQL_SA_PASSWORD=${{ secrets.MSSQL_SA_PASSWORD }}" > .env.production
          echo "IMAGE_TAG=prod" >> .env.production
          docker compose -f docker-compose.production.yml --env-file .env.production down --remove-orphans || true
          docker compose -f docker-compose.production.yml --env-file .env.production up -d